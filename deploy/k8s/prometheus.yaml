# =============================================================================
#  Prometheus — scrapes every service's /metrics, which every service serves on
#  its health port.
#
#  A StatefulSet with a PersistentVolumeClaim: the TSDB is state, and a Deployment
#  with a RWO volume would work only until the first reschedule.
#
#  The scrape configuration below is deploy/prometheus/prometheus.yml with the
#  targets unchanged — and they are unchanged because the Kubernetes Services are
#  named after the compose services, so `auth:9191` means the same thing in both
#  stacks. The only thing that moved is the file: kustomize will not load a file
#  from outside its own directory, so it is duplicated here. Keep the two in sync.
#
#  Ports: 9090 (UI, query API and the /-/healthy and /-/ready endpoints).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: marketplace
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: marketplace
data:
  alerts.yml: |
    # Prometheus alerting rules.
    #
    # Every rule here is written against a metric the services actually emit, and
    # every one has a `for` clause. An alert without a duration fires on a single
    # scrape — a transient blip — and a channel full of blips is a channel nobody
    # reads, which is how a real outage gets missed.
    #
    # The thresholds are reasoned rather than measured. They are starting points for
    # a system at this size, and the honest way to tune them is to run the k6 load
    # test, watch which panels move first, and set the limit just above the normal
    # range that produced.

    groups:
      # ---------------------------------------------------------------- edge
      - name: gateway
        interval: 30s
        rules:
          - alert: GatewayHighErrorRate
            expr: |
              sum(rate(http_server_requests_total{service="gateway", status=~"5.."}[5m]))
                /
              sum(rate(http_server_requests_total{service="gateway"}[5m]))
                > 0.05
            for: 5m
            labels:
              severity: critical
              component: gateway
            annotations:
              summary: "More than 5% of gateway requests are failing"
              description: |
                The edge is returning 5xx for {{ $value | humanizePercentage }} of requests.
                A 4xx is not counted: a declined card arrives as 422 and is the system
                working, not failing.
              runbook: |
                1. Check which routes: `sum by (route) (rate(http_server_requests_total{status=~"5.."}[5m]))`
                2. Check whether a dependency is down: the gRPC error-ratio panel
                3. If one dependency dominates, its circuit breaker should already be open

          - alert: GatewaySlowCheckout
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(http_server_duration_seconds_bucket{service="gateway", route="POST /v1/orders"}[5m]))
              ) > 1.5
            for: 10m
            labels:
              severity: warning
              component: gateway
            annotations:
              summary: "p95 checkout latency above 1.5s"
              description: |
                Checkout is taking {{ $value }}s at p95. A checkout is a five-step
                saga across four services, so a regression in any of them shows up
                here first.
              runbook: |
                1. Open the gRPC p95 panel and find which method moved
                2. Open a slow trace in Jaeger — the saga record names the step
                3. A saga step that is slow to a dependency is usually the answer

      # --------------------------------------------------------------- sagas
      - name: checkout-saga
        interval: 30s
        rules:
          - alert: SagaNeedsHumanIntervention
            expr: increase(marketplace_events_total{kind="saga_checkout", outcome="failed"}[10m]) > 0
            for: 1m
            labels:
              severity: critical
              component: order
            annotations:
              summary: "A checkout could not be rolled back"
              description: |
                {{ $value }} checkout(s) ended in the failed state, which means a
                compensation could not be applied: stock is still held, or money is
                in limbo. This is the one saga outcome that needs a person.
              runbook: |
                1. Find the orders: `curl -H "Authorization: Bearer $TOKEN" $GATEWAY/v1/orders/<id>/saga`
                2. The failed step and its error are in the response
                3. Once the blocking dependency is healthy, `RetrySaga` finishes the rollback

          - alert: NoCheckoutTraffic
            expr: |
              sum(rate(http_server_requests_total{service="gateway", route="POST /v1/orders"}[10m])) == 0
                and
              sum(rate(http_server_requests_total{service="gateway"}[10m])) > 0
            for: 15m
            labels:
              severity: warning
              component: gateway
            annotations:
              summary: "The gateway is serving requests but no checkout has been attempted"
              description: |
                Other routes are busy and checkout is silent, which is more likely to
                be a broken route than a quiet shop.

      # ----------------------------------------------------------- event pipeline
      - name: events
        interval: 30s
        rules:
          - alert: OutboxBacklogGrowing
            expr: max_over_time(marketplace_state{kind="outbox_pending"}[10m]) > 500
            for: 10m
            labels:
              severity: critical
              component: order
            annotations:
              summary: "The outbox has {{ $value }} unpublished events"
              description: |
                Events are committed to the database but not reaching Kafka, so every
                notification behind them is late. The poller is stuck or the broker
                is unreachable.
              runbook: |
                1. Check the broker: `docker compose logs kafka`
                2. Check the poller: `docker compose logs order | grep outbox`
                3. Events are not lost — they are in the table and will be published
                   when the broker returns. Delivery is at-least-once, so a consumer
                   may see duplicates; it deduplicates by event id.

          - alert: OutboxBacklogNotDraining
            expr: |
              marketplace_state{kind="outbox_pending"} > 0
                and
              deriv(marketplace_state{kind="outbox_pending"}[15m]) >= 0
            for: 15m
            labels:
              severity: warning
              component: order
            annotations:
              summary: "The outbox backlog is not shrinking"
              description: |
                The backlog is non-zero and flat. A publisher working through a
                backlog would show a negative derivative; flat means it is not
                publishing at all.

      # ------------------------------------------------------------ dependencies
      - name: services
        interval: 30s
        rules:
          - alert: HighDependencyErrorRate
            expr: |
              sum by (service) (rate(grpc_server_requests_total{code!="OK", code!="FailedPrecondition"}[5m]))
                /
              sum by (service) (rate(grpc_server_requests_total[5m]))
                > 0.10
            for: 5m
            labels:
              severity: warning
              component: "{{ $labels.service }}"
            annotations:
              summary: "{{ $labels.service }} is failing 10% of its gRPC calls"
              description: |
                FailedPrecondition is excluded on purpose: it is how a declined card
                is reported, and a shop where cards are sometimes declined is not
                an incident. Every other error code is.

          - alert: ServiceNotScraped
            expr: up{job="services"} == 0
            for: 3m
            labels:
              severity: critical
              component: "{{ $labels.service }}"
            annotations:
              summary: "{{ $labels.service }} cannot be scraped"
              description: |
                Either the service is down, or it is up and its /metrics endpoint is
                broken. Both are worth knowing: the second is how a service becomes
                invisible without anyone noticing.

          - alert: GoroutineLeak
            expr: |
              deriv(go_goroutines[30m]) > 1
            for: 30m
            labels:
              severity: warning
              component: "{{ $labels.service }}"
            annotations:
              summary: "{{ $labels.service }} is accumulating goroutines"
              description: |
                The goroutine count has risen steadily for half an hour. Load does
                not do this — a busy service plateaus. A sustained climb is a stuck
                worker, an unbounded retry, or a context that is never cancelled.

  prometheus.yml: |
    # Prometheus scrape configuration for this cluster.
    #
    # Every service exposes /metrics on the same port as its health and readiness
    # probes. One port per service keeps the deployment simple and means a service
    # can never be half-instrumented: if it answers probes, it is scraped.
    #
    # Mirror of deploy/prometheus/prometheus.yml. Changing one without the other
    # means the dashboards show a cluster that is not the one being debugged.

    # The alerting rules, mirrored from deploy/prometheus/alerts.yml for the same
    # reason the scrape config is: one set of rules, readable in both places.
    rule_files:
      - /etc/prometheus/alerts.yml

    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      # Kept identical to the compose stack so that dashboards and alerts that
      # filter on these labels keep working in both environments.
      external_labels:
        cluster: marketplace-local
        env: dev

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # The edge. It owns the RED metrics for everything a client can call.
      - job_name: gateway
        metrics_path: /metrics
        static_configs:
          - targets: ["gateway:9180"]
            labels:
              service: gateway
              tier: edge

      # Internal gRPC services. Each reports its own server-side metrics; the
      # gateway's numbers and these are compared during incident review to tell an
      # edge problem apart from a backend one.
      - job_name: services
        metrics_path: /metrics
        static_configs:
          - targets: ["auth:9191"]
            labels: { service: auth, tier: backend }
          - targets: ["catalog:9192"]
            labels: { service: catalog, tier: backend }
          - targets: ["inventory:9193"]
            labels: { service: inventory, tier: backend }
          - targets: ["order:9194"]
            labels: { service: order, tier: backend }
          - targets: ["payment:9195"]
            labels: { service: payment, tier: backend }
          - targets: ["notification:9196"]
            labels: { service: notification, tier: backend }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: marketplace
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: marketplace
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: marketplace
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: marketplace
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: marketplace
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: marketplace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: marketplace
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        # prom/prometheus runs as nobody (65534). Naming the uid here keeps the
        # fsGroup honest: without it, the PVC — which the provisioner creates
        # owned by root — is not writable by the TSDB.
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          imagePullPolicy: IfNotPresent
          # The same four flags as compose, including --web.enable-lifecycle. That
          # flag is what makes POST /-/reload work: the scrape config lives in a
          # ConfigMap, so a change needs either a reload or a rollout, and there is
          # no config-reloader sidecar here — `kubectl rollout restart
          # statefulset/prometheus` is the honest way to apply a config change.
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          # Prometheus distinguishes liveness (/-/healthy) from readiness
          # (/-/ready), and the difference is WAL replay: after an unclean shutdown
          # /-/ready answers 503 until the write-ahead log has been replayed, which
          # can take minutes. The startupProbe therefore asks /-/ready with a 150s
          # budget, so that a replay is waited out rather than killed — killing it
          # mid-replay is how a TSDB gets corrupted.
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # --------------------------------------------------------- resources
          #
          # How the memory figure was chosen: 13 scrape targets at a 15s interval
          # and 7d of retention is a small TSDB — a few hundred MiB of blocks plus
          # the head block in memory — so requests are set at 128Mi and the limit at
          # 512Mi, which is enough for query-time churn. The volume below is sized
          # on the same reasoning; the risk being defended against is a full PVC
          # (Prometheus then drops samples silently), not a large one.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: the image keeps its console templates and query cache
            # in the root filesystem. The TSDB itself is on the volume.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/part-of: marketplace
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
