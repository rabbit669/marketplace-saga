# =============================================================================
#  ###########################################################################
#  #  PLACEHOLDER SECRET — REPLACE EVERY VALUE IN THIS FILE BEFORE APPLYING   #
#  #  IT TO ANYTHING THAT IS NOT A LAPTOP.                                   #
#  ###########################################################################
#
#  The values below are the ones .env.example ships so that `kubectl apply -k
#  deploy/k8s` produces a working stack on a kind cluster with no extra setup.
#  They are checked in, which means they are public: anyone who can read this
#  repository can mint a token the gateway will accept, and can log into the
#  database the stack is using.
#
#  Replace them in one of these ways, in order of how much I would recommend it:
#
#    1. External Secrets Operator / Sealed Secrets / SOPS: keep the *name*
#       `marketplace-secrets` and delete this object from kustomization.yaml.
#    2. Generate it per environment and never commit it:
#         kubectl -n marketplace create secret generic marketplace-secrets \
#           --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#           --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#           --from-literal=GRAFANA_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#           --from-literal=ORDER_DB_DSN="postgres://user:pass@postgres:5432/order_db?sslmode=require" \
#           ... --dry-run=client -o yaml | kubectl apply -f -
#    3. Worst case, edit this file and accept that it is in the history forever.
#
#  JWT_SECRET must be at least 32 bytes: the gateway and auth validate the length
#  at startup and refuse to boot otherwise (pkg/jwtx.MinSecretLength). The
#  placeholder is 45 bytes so that a copy of it boots; a short value will not.
#
#  Every *_DB_DSN value is the whole connection string, including the password,
#  and its variable name is the one deploy/docker-compose.yml uses — the services
#  read `<SERVICE>_DB_DSN` and nothing else, so there is no separate place for
#  the host, port or database name to disagree with it. POSTGRES_PASSWORD is
#  used by the PostgreSQL container itself; changing one without the other will
#  leave the services unable to log in.
#
#  sslmode=disable matches compose, where the database is on the same bridge
#  network. In a cluster where the traffic crosses a node boundary, use
#  sslmode=verify-full with the server's CA — `sslmode=require` alone does not
#  verify the certificate chain.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: marketplace-secrets
  namespace: marketplace
  labels:
    app.kubernetes.io/part-of: marketplace
  annotations:
    marketplace.io/replace-me: "placeholder values, checked in on purpose — see the header of this file"
type: Opaque
# stringData rather than data: the point of this file is to be obviously
# replaceable, and base64 would only hide that these are the documented defaults.
stringData:
  # ------------------------------------------------------------- credentials
  POSTGRES_PASSWORD: "marketplace"                                       # .env.example: POSTGRES_PASSWORD
  JWT_SECRET: "change-me-in-production-please-use-32-bytes-min"          # .env.example: JWT_SECRET
  GRAFANA_ADMIN_PASSWORD: "admin"                                        # .env.example: GRAFANA_ADMIN_PASSWORD

  # --------------------------------------- one DSN per service, per database
  # Names and shape are copied from deploy/docker-compose.yml so that the same
  # environment variable names appear in both stacks. One database per service:
  # no foreign key ever crosses these boundaries, and a service can be pointed at
  # its own server without touching anyone else's configuration.
  AUTH_DB_DSN: "postgres://marketplace:marketplace@postgres:5432/auth_db?sslmode=disable"
  CATALOG_DB_DSN: "postgres://marketplace:marketplace@postgres:5432/catalog_db?sslmode=disable"
  INVENTORY_DB_DSN: "postgres://marketplace:marketplace@postgres:5432/inventory_db?sslmode=disable"
  ORDER_DB_DSN: "postgres://marketplace:marketplace@postgres:5432/order_db?sslmode=disable"
  PAYMENT_DB_DSN: "postgres://marketplace:marketplace@postgres:5432/payment_db?sslmode=disable"
  NOTIFICATION_DB_DSN: "postgres://marketplace:marketplace@postgres:5432/notification_db?sslmode=disable"
