# =============================================================================
#  Redis — rate-limit counters and short-lived session state.
#
#  A Deployment with no PersistentVolumeClaim, on purpose. compose gives Redis a
#  named volume but disables persistence (`--save "" --appendonly no`), because
#  losing the cache is survivable: the rate limiter refills and the sessions
#  re-authenticate. A PVC here would make a restarted pod wait for a volume that
#  contains nothing worth keeping, so the storage is an emptyDir and the honest
#  statement of what this component is.
#
#  Port 6379, matching compose (whose 6379 host port is a compose-only concern).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: marketplace
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: marketplace
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: marketplace
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: marketplace
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: marketplace
spec:
  # One replica: this is a cache, not a shard set. A second replica would need
  # client-side sharding or a sentinel, and neither is worth it for counters that
  # can be rebuilt.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: marketplace
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: marketplace
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        # redis:7-alpine starts as root and drops to the redis user with gosu when
        # the first argument is redis-server. fsGroup 1000 is that user's group, so
        # the emptyDir is writable after the swap.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # Byte-for-byte the command from deploy/docker-compose.yml: persistence
          # off, memory bounded, eviction policy allkeys-lru. The bound is enforced
          # by Redis itself, which is the reason the container limit below sits
          # above it rather than below.
          command:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # redis-cli ping is the compose healthcheck, and it is the cheapest
          # question with a meaningful answer. Liveness is lenient (15s x 4 = 60s):
          # a Redis that is briefly slow should not be restarted, because a restart
          # throws away the rate-limit state that is protecting the gateway.
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # --------------------------------------------------------- resources
          #
          # How the memory figure was chosen: maxmemory is pinned at 256mb by the
          # server flag above, so the container limit is set just above it (320Mi)
          # to leave room for the allocator's fragmentation and the per-connection
          # buffers that maxmemory does not account for. A container limit *below*
          # maxmemory would let the kernel OOM-kill Redis before its own eviction
          # policy ran, which turns a cache miss into a crash loop.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 320Mi
          securityContext:
            # Same reasoning as PostgreSQL: the entrypoint needs to hand over to
            # the redis user, so those four capabilities are named and everything
            # else is dropped.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
