version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - dupl
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 4
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - whyNoLint
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    generated: lax
    rules:
      # Generated protobuf code is not ours to lint.
      - path: pkg/proto/
        linters: [revive, gocritic, dupl, gosec, errcheck, unparam, staticcheck]
      - path: _test\.go
        linters: [dupl, gosec, errcheck, goconst, unparam, bodyclose, noctx]
      - path: test/
        linters: [dupl, gosec, errcheck, goconst, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/marketplace
